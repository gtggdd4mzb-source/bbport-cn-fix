# ============================================================================
# bbport.ini — 低显存 (4GB) 稳定优先配置
# 放到 bbport-windows\ 下（和 Bloodborne.exe 同级）
# ============================================================================

# 【最重要】输出分辨率。默认 1920x1080 时 preset=0 不会启用降分辨率渲染，
# 游戏会按原生 1080p 渲染 —— 4GB 显存必爆。1280x720 是安全值。
output_res=1280x720

# upscaler=off 有两个作用：
#   1) 渲染=输出=720p 时 FSR 缩放比例本来就是 1.0（纯空转），关掉省一个 GPU pass
#   2) ★ ObjectMotion 会在 upscaler != off 时自动启用；关掉即关闭对象运动向量。
#      上游 issue #30 实测该路径会让水域帧率腰斩（39.8 -> 66.5 FPS），
#      并且它把整设备排空(Scheduler::Finish)交织进呈现路径。
upscaler=off
preset=0

# 关掉"实时改分辨率"（默认已关，显式写出避免歧义）
live_resolution=0

# 跳过启动 logo/开场视频
skip_intro=1

# 关闭吃显存/带宽的后期特效
effect_chromatic_aberration=0
effect_dof=0
effect_motion_blur=0
effect_ssao=0
effect_dynamic_shadows=0

# 降一级模型 LOD，减少纹理驻留
model_lod=1
